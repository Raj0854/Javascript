<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Weather Info 🌦️</h2>
        <form>
            <div class="city">
                <p>City 🏙️</p>
                <input type="text" id="city" placeholder="Eg. Virar">
                <button id="btn">Search</button>
            </div>
        </form>
        <div class="msg">
            <p> City : </p>
            <p>Temperature : </p>
            <p>Humidity : </p>
            <p>Wind : </p>
        </div>
    </div>

</body>

</html>
